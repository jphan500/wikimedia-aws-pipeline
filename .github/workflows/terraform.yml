name: terraform
on:
  pull_request:
    paths: ["infra/envs/**"]
  push:
    branches: [main]
    paths: ["infra/envs/**"]

permissions:
  id-token: write
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/envs/dev
    steps:
      - uses: actions/checkout@v4
      - name: Print OIDC subject
        run: |
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          echo "$TOKEN" | cut -d '.' -f 2 | base64 -d 2>/dev/null | jq -r .sub
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.10"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-2
      - run: terraform fmt -check
      - run: terraform init
      - run: terraform validate
      - run: terraform plan -input=false
        env:
          TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}
      - name: apply
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: terraform apply -auto-approve -input=false